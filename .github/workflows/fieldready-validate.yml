name: Validate FieldReady Web

on:
  pull_request:
  push:
    branches: [ main, fieldready-backend-foundation-v4.2.0 ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static validation
        run: python3 tests/static_validate.py
      - name: Sync regression tests
        run: node --test tests/*.cjs
      - name: Username migration in isolated PostgreSQL
        run: |
          npm install --prefix /tmp/fieldready-sql-test @electric-sql/pglite@0.3.14 --ignore-scripts --no-audit --no-fund
          node --test tests/username_database.mjs

  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.62.0 pypdf==6.10.0
          python -m playwright install --with-deps chromium
      - name: Complete role and two-device workflows
        run: python tests/role_journeys.py
      - name: Skill sheets, role controls, and exports
        run: python tests/roles_browser.py
      - name: Longitudinal study workflows
        run: python tests/study_browser.py
      - name: Retained local testing mode
        run: python tests/warning_browser.py
      - name: Username login and PDF/CSV file sharing
        run: python tests/files_browser.py
