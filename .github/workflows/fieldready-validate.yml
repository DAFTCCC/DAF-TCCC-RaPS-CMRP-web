name: Validate FieldReady Web

on:
  pull_request:
  push:
    branches: [ main, fieldready-backend-foundation-v4.2.0 ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static validation
        run: python3 tests/static_validate.py